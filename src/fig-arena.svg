<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C/DTD SVG 1.1//EN"
  "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1"
     baseProfile="full"
     width="600" height="880"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
  <style type="text/css">
    <![CDATA[
      svg {
        font-family: "Open Sans", Arial, sans-serif;
      }

      .arena-wall {
          fill: #ccc;
          stroke: #333;
          stroke-width: .02;
      }

      .inner-wall {
          fill: #555;
          stroke: #333;
          stroke-width: .02;
      }

      .line-follow-guide {
          fill: none;
          stroke: black;
          stroke-width: .012;
      }

      .line-follow-guide-back {
          fill: none;
          stroke: white;
          stroke-width: .05;
      }

      .can {
          stroke: black;
          stroke-width: 0.01;
          fill: silver;
      }

      #robot {
          fill: #02A6F2;
          stroke: black;
          stroke-width: 0.02;
      }

      .scoring-line {
          stroke: white;
          stroke-width: 0.05;
          fill: none;
      }

      #marker {
          stroke: red;
          stroke-width: 0.04;
      }

      .start-zone {
        stroke: #333;
        stroke-width: 0.02;
        fill: #ffd;
      }

      .legend-label {
        font-size: 0.2px;
        text-anchor: start;
        dominant-baseline: central;
      }

      .marker-label {
        font-size: 0.12px;
        text-anchor: central;
        dominant-baseline: central;
        fill: red;
        font-family: monospace;
      }

      /*.dimension, .dimension-guide, .marker-label {
         display: none;
      }*/
      line.dimension {
        stroke: black;
        stroke-width: 0.01;
        marker-start: url(#dimension-arrow-head-start);
        marker-end: url(#dimension-arrow-head-end);
      }

      text.dimension {
        fill: black;
        font-size: 0.11px;
        text-anchor: middle;
        dominant-baseline: central;
        font-family: monospace;
      }
      .dimension-arrow-head {
        fill: black;
      }
      .dimension-guide {
        stroke: #666;
        stroke-width: 0.01;
        stroke-dasharray: 0.005 0.03;
        stroke-linecap: round;
        fill: none;
      }

    ]]>
  </style>
  <!-- common patterns -->
  <defs>
    <g
      transform="scale(0.05)"
      id="dimension-arrow-head">
      <path
         id="path218"
         class="dimension-arrow-head"
         d="M0,0 L1,1 L1,-1 L0,0" />
    </g>
    <marker
       markerUnits="userSpaceOnUse"
       refY="1"
       refX="0"
       markerHeight="2"
       markerWidth="1"
       orient="auto"
       id="dimension-arrow-head-start">
      <use
         transform="translate(0,1)"
         xlink:href="#dimension-arrow-head" />
    </marker>
    <marker
       markerUnits="userSpaceOnUse"
       refY="1"
       refX="1"
       markerHeight="2"
       markerWidth="1"
       orient="auto"
       id="dimension-arrow-head-end">
      <use
         transform="matrix(-1,0,0,1,1,1)"
         xlink:href="#dimension-arrow-head" />
    </marker>
    <circle cx="0" cy="0" r="0.07" id="can" />
    <line x1="-0.05" y1="0" x2="0.05" y2="0" id="marker"/>
    <rect width="0.5" height="0.3"
          x="-0.25" y="-0.15"
          id="robot"/>
    <g id="marker-pair">
      <use xlink:href="#marker" transform="translate(0.075)" class="marker"/>
      <use xlink:href="#marker" transform="translate(-0.075)" class="marker"/>
    </g>
    <g id="side-zone">

      <!-- passing lines -->
      <line class="scoring-line"
            x1="2.715"
            y1="0"
            x2="2.715"
            y2="1.48" />

      <line class="scoring-line"
            x1="0.65"
            y1="2.715"
            x2="1.48"
            y2="2.715" />
      <line class="scoring-line"
            x1="0"
            y1="2.715"
            x2="0.35"
            y2="2.715" />

      <line class="scoring-line"
            x1="1.67"
            y1="1.67"
            x2="1.22"
            y2="1.22" />

      <line class="scoring-line"
            x1="2.7"
            y1="2.7"
            x2="1.87"
            y2="1.87" />

      <line class="scoring-line"
            x1="3.92"
            y1="1.48"
            x2="4.44"
            y2="0.96" />

      <line class="scoring-line"
            x1="4.64"
            y1="0.76"
            x2="4.79"
            y2="0.61" />

      <!-- Start zone -->
      <rect width="1"
            height="1"
            x="2.7"
            y="0"
            class="start-zone"/>

      <!-- Line following guide -->
      <polyline points="2.7,0.5 2.45,0.5 2.09,0.86 2.09,1.48 1.49,2.08 0.7,2.08 0.5,2.33 0.5,4.18 1.22,4.9 1.69,4.9" class="line-follow-guide-back" />
      <polyline points="2.7,0.5 2.45,0.5 2.09,0.86 2.09,1.48 1.49,2.08 0.7,2.08 0.5,2.33 0.5,4.18 1.22,4.9 1.69,4.9" class="line-follow-guide" />
      <g transform="translate(3.21 0.5)">
        <use xlink:href="#robot"/>
      </g>

      <!-- cans -->
      <use xlink:href="#can" transform="translate(4.18 0.75)" class="can"/>
      <use xlink:href="#can" transform="translate(0.61 1.65)" class="can"/>
      <use xlink:href="#can" transform="translate(1.22 2.4)" class="can"/>
      <use xlink:href="#can" transform="translate(0.74 3.44)" class="can"/>
      <use xlink:href="#can" transform="translate(2.4 1.48)" class="can"/>

      <!-- Inner wall -->
      <rect width="1.22"
            height="1.22"
            x="1.48"
            y="2.7"
            class="inner-wall"/>
      <!-- Outer square wall -->
      <rect width="1.22"
            height="1.22"
            x="0"
            y="0"
            class="inner-wall"/>
      <!-- Outer wall triangle -->
      <polygon points="5.4,0 4.18,0 5.4,1.22" class="inner-wall" />

      <!-- Markers -->
      <use xlink:href="#marker-pair" transform="translate(1.24 0.61) rotate(90)" />
      <use xlink:href="#marker-pair" transform="translate(2.09 2.69)" />
      <use xlink:href="#marker-pair" transform="translate(0.02 1.96) rotate(90)" />
      <use xlink:href="#marker-pair" transform="translate(4.79 0.61) rotate(45)" />
    </g>
  </defs>
  <!-- white background -->
  <rect width="100%" height="100%" fill="white"/>
  <!-- transform for arena-space coordinates -->
  <g id="arena"
     transform="translate(25 30) scale(100)">

     <!-- arena wall -->
     <rect width="5.4"
           height="5.4"
           x="0"
           y="0"
           class="arena-wall"/>

    <!-- zones -->
    <use xlink:href="#side-zone"/>
    <use xlink:href="#side-zone" transform="rotate(180 2.7 2.7)"/>

    <!-- Marker labels -->
    <text class="marker-label" y="0.54" x="1.3">0</text>
    <text class="marker-label" y="0.69" x="1.3">1</text>

    <text class="marker-label" y="4.87" x="4">0</text>
    <text class="marker-label" y="4.72" x="4">1</text>

    <text class="marker-label" y="2.58" x="2.13">2</text>
    <text class="marker-label" y="2.58" x="1.98">3</text>

    <text class="marker-label" y="2.85" x="3.19">2</text>
    <text class="marker-label" y="2.85" x="3.35">3</text>

    <text class="marker-label" y="1.89" x="0.1">4</text>
    <text class="marker-label" y="2.04" x="0.1">5</text>

    <text class="marker-label" y="3.52" x="5.22">4</text>
    <text class="marker-label" y="3.37" x="5.22">5</text>

    <text class="marker-label" y="4.66" x="0.59">6</text>
    <text class="marker-label" y="4.77" x="0.73">7</text>

    <text class="marker-label" y="0.73" x="4.72">6</text>
    <text class="marker-label" y="0.62" x="4.6">7</text>

    <!-- Dimensions -->
    <line x1="0" y1="1.28" x2="1.22" y2="1.28" class="dimension" />
    <text class="dimension" y="1.37" x="0.61">1220±100mm</text>

    <line x1="1.78" y1="0" x2="1.78" y2="1.22" class="dimension" />
    <line x1="1.22" y1="1.22" x2="1.78" y2="1.22" class="dimension-guide" />
    <text class="dimension" transform="rotate(-90, 1.85 0.61)" y="0.61" x="1.85">1220±100mm</text>

    <line x1="1.48" y1="0" x2="1.48" y2="0.61" class="dimension" />
    <line x1="1.22" y1="0.61" x2="1.48" y2="0.61" class="dimension-guide" />
    <text class="dimension" transform="rotate(-90, 1.6 0.3)" y="0.3" x="1.6">610±10mm</text>

    <line x1="0" y1="3.9" x2="1.48" y2="3.9" class="dimension" />
    <text class="dimension" y="3.84" x="0.9">1480±100mm</text>

    <line x1="4.18" y1="-0.06" x2="5.4" y2="-0.06" class="dimension" />
    <text class="dimension" y="-0.13" x="4.79">1220±100mm</text>

    <line x1="4.78" y1="3.75" x2="5.4" y2="3.75" class="dimension" />
    <text class="dimension" y="3.65" x="5.08">610±100mm</text>

    <line x1="4.79" y1="4.18" x2="4.79" y2="3.75" class="dimension" />
    <text class="dimension" y="4" x="4.45">430±100mm</text>

    <line x1="2.4" y1="1.48" x2="2.7" y2="1.48" class="dimension" />
    <text class="dimension" y="1.37" x="2.5">300±20mm</text>

    <line x1="2.4" y1="1.48" x2="2.4" y2="2.7" class="dimension" />
    <text class="dimension" y="2" x="2.1">600±20mm</text>

    <line x1="1.48" y1="2.4" x2="2.09" y2="2.4" class="dimension" />
    <line x1="1.48" y1="2.4" x2="1.48" y2="2.7" class="dimension-guide" />
    <line x1="2.09" y1="2.4" x2="2.09" y2="2.7" class="dimension-guide" />
    <text class="dimension" y="2.32" x="1.78">610±10mm</text>

    <line x1="0.4" y1="1.885" x2="0.4" y2="2.035" class="dimension" />
    <line x1="0" y1="1.885" x2="0.4" y2="1.885" class="dimension-guide" />
    <line x1="0" y1="2.035" x2="0.4" y2="2.035" class="dimension-guide" />
    <text class="dimension" y="1.89" x="0.73">150±10mm</text>

    <line x1="0.25" y1="1.96" x2="0.25" y2="2.7" class="dimension" />
    <line x1="0" y1="1.96" x2="0.25" y2="1.96" class="dimension-guide" />
    <text class="dimension" y="2.4" x="0.55">740±10mm</text>

    <line x1="4.18" y1="0.85" x2="4.18" y2="0.75" class="dimension-guide" />
    <line x1="4.18" y1="0.85" x2="5.4" y2="0.85" class="dimension" />
    <text class="dimension" y="0.95" x="4.75">1220±100mm</text>

    <line x1="4.18" y1="0.75" x2="4.18" y2="0" class="dimension" />
    <text class="dimension" y="0.4" x="4.05" transform="rotate(-90, 4.05 0.4)">750±100mm</text>

    <line x1="0" y1="3" x2="0.5" y2="3" class="dimension" />
    <text class="dimension" y="2.9" x="0.31">500±100mm</text>

    <line x1="3.92" y1="3" x2="4.18" y2="3" class="dimension" />
    <text class="dimension" y="3.15" x="4.2">260±100mm</text>

    <line x1="3.92" y1="3" x2="3.92" y2="2.7" class="dimension" />
    <text class="dimension" y="2.86" x="4.25">300±100mm</text>

    <line x1="3.92" y1="1.96" x2="4.66" y2="1.96" class="dimension" />
    <text class="dimension" y="2.1" x="4.3">740±100mm</text>

    <line x1="4.66" y1="1.48" x2="4.66" y2="1.96" class="dimension" />
    <line x1="3.92" y1="1.48" x2="4.66" y2="1.48" class="dimension-guide" />
    <text class="dimension" y="1.6" x="4.8" transform="rotate(-90, 4.8 1.6)">740±100mm</text>

    <line x1="0" y1="5.5" x2="5.4" y2="5.5" class="dimension" />
    <text class="dimension" y="5.6" x="2.7">5400±100mm</text>

    <line x1="5.5" y1="0" x2="5.5" y2="5.4" class="dimension" />
    <text class="dimension" transform="rotate(-90, 5.6 2.7)" y="2.7" x="5.6">5400±100mm</text>

  </g>
  <g id="legend" transform="translate(35 580) scale(75)">
    <rect width="1"
            height="1"
            x="0"
            y="0.5"
            class="start-zone"/>
    <use x="0.5" y="1" xlink:href="#robot"/>
    <text
       class="legend-label"
       y="1"
       x="1.2">Robot starting area</text>

    <use xlink:href="#can" transform="translate(0.5 2.2) scale(2)" class="can"/>
    <text
       class="legend-label"
       y="2.2"
       x="1.2">Can</text>

    <use xlink:href="#marker" transform="translate(0.5 3.4) scale(2) rotate(90)" class="marker"/>
    <text class="marker-label" y="3.4" x="0.65">2</text>
    <text
       class="legend-label"
       y="3.4"
       x="1.2">Marker (with ID)</text>

    <rect width="0.4" height="0.9" x="4.55" y="0.5" fill="#ccc" />
    <line class="scoring-line"
            x1="4.75"
            y1="0.5"
            x2="4.75"
            y2="1.4" />
    <text
       class="legend-label"
       y="1"
       x="5.2">Scoring Line</text>

    <rect width="0.5"
            height="0.9"
            x="4.5"
            y="1.8"
            class="inner-wall"/>
    <text
       class="legend-label"
       y="2.2"
       x="5.2">Inner wall</text>

    <rect width="0.4" height="0.7" x="4.55" y="3.1" fill="#ccc" />
    <line class="line-follow-guide-back"
            x1="4.75"
            y1="3.1"
            x2="4.75"
            y2="3.8" />
    <line class="line-follow-guide"
            x1="4.75"
            y1="3.1"
            x2="4.75"
            y2="3.8" />
    <text
       class="legend-label"
       y="3.4"
       x="5.2">Line follow guide</text>
  </g>
</svg>
